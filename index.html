<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  body{margin:0;background:#0b0b0b;color:#ddd;font:13px sans-serif}
  .bar{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;white-space:nowrap}
  button{background:#1a1a1a;color:#ccc;border:1px solid #333;border-radius:6px;padding:5px 10px;flex:none}
  button.on{background:#f0b90b;color:#000;border-color:#f0b90b}
  #main{height:56vh} #rsi{height:18vh}
</style>
</head>
<body>
<div class="bar" id="syms"></div>
<div class="bar" id="tfs"></div>
<div class="bar" id="inds"></div>
<div class="bar" id="tools"></div>
<div id="main"></div>
<div id="rsi"></div>

<!-- ===== LÕI ===== -->
<script src="toolMain.js?v=1"></script>
<script src="indicatorMain.js?v=1"></script>

<!-- ===== CÔNG CỤ VẼ: thêm tool mới = thêm 1 dòng ở đây ===== -->
<script src="tools/trend.js?v=1"></script>
<script src="tools/ray.js?v=1"></script>
<script src="tools/hline.js?v=1"></script>
<script src="tools/vline.js?v=1"></script>
<script src="tools/rect.js?v=1"></script>
<script src="tools/measure.js?v=1"></script>
<script src="tools/fibRetracement.js?v=1"></script>
<script src="tools/fibExtension.js?v=1"></script>

<!-- ===== CHỈ BÁO: thêm indicator mới = thêm 1 dòng ở đây ===== -->
<script src="indicators/utils.js?v=1"></script>
<script src="indicators/volume.js?v=1"></script>
<script src="indicators/ema89.js?v=1"></script>
<script src="indicators/ema200.js?v=1"></script>
<script src="indicators/sonicr.js?v=1"></script>
<script src="indicators/rsi.js?v=1"></script>
<script src="indicators/snr.js?v=1"></script>
<script src="indicators/volumeProfile.js?v=1"></script>

<script>
Telegram.WebApp.ready(); Telegram.WebApp.expand();

const SYMS = ['BTCUSDT','ETHUSDT','BNBUSDT'];
const TFS  = ['15m','1h','4h','1d'];
const HOSTS = ['https://api.binance.com','https://data-api.binance.vision'];
let sym = 'BTCUSDT', tf = '4h', ws, candles = [], reqId = 0;

// ===== tạo chart =====
const opt = {
  autoSize:true,
  layout:{background:{color:'#0b0b0b'},textColor:'#aaa'},
  grid:{vertLines:{color:'#161616'},horzLines:{color:'#161616'}},
  timeScale:{timeVisible:true,borderColor:'#333'},
  rightPriceScale:{borderColor:'#333'},
  crosshair:{mode:0}
};
const main = LightweightCharts.createChart(document.getElementById('main'), opt);
const rsiC = LightweightCharts.createChart(document.getElementById('rsi'), opt);
const cs = main.addCandlestickSeries({
  upColor:'#26a69a',downColor:'#ef5350',
  borderUpColor:'#26a69a',borderDownColor:'#ef5350',
  wickUpColor:'#26a69a',wickDownColor:'#ef5350'});

// đồng bộ 2 chart khi kéo/zoom
let lock=false;
const sync=(a,b)=>a.timeScale().subscribeVisibleLogicalRangeChange(r=>{
  if(lock||!r)return; lock=true; b.timeScale().setVisibleLogicalRange(r); lock=false;});
sync(main,rsiC); sync(rsiC,main);

// ===== khởi tạo công cụ + chỉ báo =====
ToolMain.init({chart:main, series:cs, getCandles:()=>candles, bar:document.getElementById('tools')});
IndicatorMain.init({main, rsiC, cs, getCandles:()=>candles, bar:document.getElementById('inds')});

function render(full=true){
  cs.setData(candles);
  IndicatorMain.render(full);
}

// ===== dữ liệu Binance =====
async function getKlines(){
  for(const h of HOSTS){
    try{
      const r = await fetch(`${h}/api/v3/klines?symbol=${sym}&interval=${tf}&limit=500`);
      if(r.ok) return await r.json();
    }catch(e){}
  }
  throw new Error('Không lấy được dữ liệu');
}

async function load(){
  const my = ++reqId;
  if(ws) ws.close();
  ToolMain.clear();                       // bản vẽ của mã cũ sẽ sai giá nên xóa
  const j = await getKlines();
  if(my!==reqId) return;                  // người dùng đã bấm mã khác
  candles = j.map(k=>({time:k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));
  render(true); main.timeScale().fitContent();

  ws = new WebSocket(`wss://stream.binance.com:9443/ws/${sym.toLowerCase()}@kline_${tf}`);
  ws.onmessage = e=>{
    const k = JSON.parse(e.data).k;
    const c = {time:k.t/1000,open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v};
    const last = candles[candles.length-1];
    if(last.time===c.time) candles[candles.length-1]=c; else candles.push(c);
    render(false);                        // false = bỏ qua chỉ báo nặng (SNR)
  };
}

// ===== nút chọn mã / khung thời gian =====
function buttons(id,list,get,set){
  const el=document.getElementById(id); el.innerHTML='';
  list.forEach(v=>{
    const b=document.createElement('button'); b.textContent=v;
    if(get()===v) b.className='on';
    b.onclick=()=>{set(v); buttons(id,list,get,set); load();};
    el.appendChild(b);
  });
}
buttons('syms',SYMS,()=>sym,v=>sym=v);
buttons('tfs',TFS,()=>tf,v=>tf=v);
load();
</script>
</body>
</html>
